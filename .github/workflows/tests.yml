# Запускаем при создании PR в ветку main (или master)

name: CI Tests

"on":
  pull_request:
    branches:
      - "main"
      - "master"

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip and uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-python-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-pip-

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          uv sync --all-extras --dev
          pip install -e .

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install black ruff mypy pip-audit
          python -m pip install safety bandit build yamllint
          npm install -g markdownlint-cli

      - name: Format and lint Python
        run: |
          black --check .
          ruff check .
          mypy .

      - name: Lint configuration files
        run: |
          yamllint .github/**/*.yml
          npx markdownlint-cli README.md .github/**/*.yml

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build package
        run: python -m build

      - name: Security checks
        run: |
          pip-audit --output text
          safety scan --output text
          bandit -r . --exclude ./.venv --skip B404,B603,B607
