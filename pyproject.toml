[project]
name = "pr-reviewr"
version = "0.1.0"
description = "Smart code review assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "chromadb>=0.5.0",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-javascript>=0.20.0",
    "tree-sitter-c-sharp>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
follow_imports = "silent"

[tool.hatch.build.targets.wheel]
packages = ["indexer", "api", "reviewer", "ado_client"]
